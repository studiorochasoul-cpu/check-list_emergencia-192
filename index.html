<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Check-list 192 Macaé</title>
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="./icone.png">
    <link rel="apple-touch-icon" href="./icone.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Bibliotecas para o PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Ícones -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #pdf-report-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            background: white;
            width: 800px;
            color: #000;
        }

        input, textarea {
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { jsPDF } = window.jspdf;

        // Ícones do Cabeçalho
        const StarOfLife = ({ className }) => (
            <svg viewBox="0 0 24 24" className={className} xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="9.5" y="1" width="5" height="22" rx="1" />
                    <rect x="9.5" y="1" width="5" height="22" rx="1" transform="rotate(60 12 12)" />
                    <rect x="9.5" y="1" width="5" height="22" rx="1" transform="rotate(120 12 12)" />
                </g>
                <g stroke="#ffffff" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="5.5" x2="12" y2="18.5" />
                    <path d="M12 16.5c-1.5 0-2.5-.5-2-2 .5-1.5 2.5-1.5 2.5-3 0-1.5-1.5-1.5-1.5-3 0-.5-.5-1-1-1" />
                </g>
            </svg>
        );

        const ITENS_CHECKLIST = [
            "Documentação", "Lanternas: Dian. e Tras.", "Buzina", "Luz de freio", 
            "Setas", "Pisca Alerta", "Farol Alto", "Farol Baixo", 
            "Lanterna", "Luz de Ré", "Sirene", "Giroflex", 
            "Vidros", "Macaco", "Chave de Roda", "Estepe", 
            "Pneus", "Limpeza Interna", "Limpeza Externa", "Nível de água radiador", 
            "Nível de óleo", "Nível de água limpador", "Ar condicionado", "Limpador de parabrisa"
        ];

        function App() {
            const [isGenerating, setIsGenerating] = useState(false);
            const [showActionModal, setShowActionModal] = useState(false);
            const [pdfData, setPdfData] = useState({ file: null, url: '', filename: '' });
            const [showInstallBtn, setShowInstallBtn] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });
            }, []);

            const handleInstallClick = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setShowInstallBtn(false);
                    }
                    setDeferredPrompt(null);
                }
            };

            const [headerData, setHeaderData] = useState(() => {
                return {
                    condutor: localStorage.getItem('samu_condutor') || '',
                    matricula: localStorage.getItem('samu_matricula') || '',
                    data: new Date().toISOString().split('T')[0],
                    base: localStorage.getItem('samu_base') || '',
                    modelo: localStorage.getItem('samu_modelo') || '',
                    vtr: localStorage.getItem('samu_vtr') || '',
                    placa: localStorage.getItem('samu_placa') || '',
                    km: '',
                    combustivel: 'Cheio'
                };
            });

            const [items, setItems] = useState(
                ITENS_CHECKLIST.map((nome, index) => ({
                    id: index + 1, nome, status: null, avariaText: ''
                }))
            );

            const [observacoes, setObservacoes] = useState('');
            const [photos, setPhotos] = useState([]);

            const handleHeaderChange = (e) => {
                const { name, value } = e.target || e;
                setHeaderData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (['condutor', 'matricula', 'base', 'modelo', 'vtr', 'placa'].includes(name)) {
                        localStorage.setItem(`samu_${name}`, value);
                    }
                    return newData;
                });
            };

            const handleItemStatus = (id, status) => {
                setItems(prev => prev.map(item => 
                    item.id === id ? { ...item, status, avariaText: status === 'ok' ? '' : item.avariaText } : item
                ));
            };

            const handleAvariaText = (id, text) => {
                setItems(prev => prev.map(item => 
                    item.id === id ? { ...item, avariaText: text } : item
                ));
            };

            const handleMarkAllOk = () => {
                setItems(prev => prev.map(item => ({
                    ...item,
                    status: 'ok',
                    avariaText: ''
                })));
            };

            const handlePhotoUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPhotos(prev => [...prev, event.target.result]);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const removePhoto = (indexToRemove) => {
                setPhotos(prev => prev.filter((_, index) => index !== indexToRemove));
            };

            const formatDateBR = (dateString) => {
                if (!dateString) return '';
                const [year, month, day] = dateString.split('-');
                return `${day}/${month}/${year}`;
            };

            const generatePDF = async () => {
                setIsGenerating(true);
                
                try {
                    const element = document.getElementById('pdf-report-container');
                    
                    const canvas = await html2canvas(element, {
                        scale: 2, 
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff'
                    });

                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const margin = 10;
                    const innerWidth = pdfWidth - (margin * 2);
                    
                    const imgProps = pdf.getImageProperties(imgData);
                    let imgHeight = (imgProps.height * innerWidth) / imgProps.width;

                    pdf.addImage(imgData, 'JPEG', margin, margin, innerWidth, imgHeight);

                    // Adiciona fotos em lotes de 3 por página
                    if (photos.length > 0) {
                        const fotosPorPagina = 3;
                        const usableHeight = pdfHeight - (margin * 2) - 10; // -10 para o rodapé
                        const slotHeight = usableHeight / 3;

                        for (let i = 0; i < photos.length; i += fotosPorPagina) {
                            pdf.addPage();
                            const chunk = photos.slice(i, i + fotosPorPagina);

                            for (let j = 0; j < chunk.length; j++) {
                                const photoData = chunk[j];
                                const photoProps = pdf.getImageProperties(photoData);

                                let pWidth = innerWidth;
                                let pHeight = (photoProps.height * pWidth) / photoProps.width;

                                const maxPhotoHeightInSlot = slotHeight - 15; 

                                if (pHeight > maxPhotoHeightInSlot) {
                                    pHeight = maxPhotoHeightInSlot;
                                    pWidth = (photoProps.width * pHeight) / photoProps.height;
                                }

                                const xOffset = margin + (innerWidth - pWidth) / 2;
                                const yOffset = margin + (j * slotHeight) + ((slotHeight - pHeight) / 2);

                                pdf.addImage(photoData, 'JPEG', xOffset, yOffset, pWidth, pHeight);
                                
                                pdf.setFontSize(10);
                                pdf.setTextColor(100);
                                pdf.text(`Anexo Fotográfico ${i + j + 1}`, xOffset, yOffset + pHeight + 5);
                            }
                        }
                    }

                    // ADICIONADO: Rodapé em todas as páginas
                    const totalPages = pdf.internal.getNumberOfPages();
                    for (let i = 1; i <= totalPages; i++) {
                        pdf.setPage(i);
                        pdf.setFontSize(8);
                        pdf.setTextColor(150);
                        pdf.text('Aplicativo desenvolvido por @rochasoulmusic', pdfWidth / 2, pdfHeight - 5, { align: 'center' });
                    }

                    // ADICIONADO: Nome do arquivo modificado
                    const primeiroNome = headerData.condutor ? headerData.condutor.trim().split(' ')[0] : '';
                    const sufixoNome = primeiroNome ? `_${primeiroNome}` : '';
                    const filename = `Checklist_VTR_${headerData.vtr || 'X'}_${formatDateBR(headerData.data).replace(/\//g, '-')}${sufixoNome}.pdf`;
                    
                    const pdfBlob = pdf.output('blob');
                    const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                    const url = URL.createObjectURL(pdfBlob);

                    setPdfData({ file, url, filename });
                    setShowActionModal(true);

                } catch (error) {
                    console.error("Erro ao gerar PDF:", error);
                    alert("Ocorreu um erro ao gerar o documento.");
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleDownload = () => {
                const link = document.createElement('a');
                link.href = pdfData.url;
                link.download = pdfData.filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setShowActionModal(false);
            };

            const handleShare = async () => {
                if (navigator.canShare && navigator.canShare({ files: [pdfData.file] })) {
                    try {
                        await navigator.share({
                            title: 'Check-list de AMBULÂNCIA',
                            text: `Check-list da VTR ${headerData.vtr} realizado em ${formatDateBR(headerData.data)}.`,
                            files: [pdfData.file]
                        });
                    } catch (err) {
                        console.log("Partilha cancelada ou falhou:", err);
                    }
                } else {
                    alert("O seu dispositivo não suporta partilha direta. Por favor, utilize a opção de baixar.");
                }
                setShowActionModal(false);
            };

            const avarias = items.filter(i => i.status === 'avariado');
            const metadeItens = Math.ceil(items.length / 2);
            const coluna1 = items.slice(0, metadeItens);
            const coluna2 = items.slice(metadeItens);

            return (
                <div className="min-h-screen pb-32">
                    
                    {/* Botão de Instalação Nativo (Se disponível) */}
                    {showInstallBtn && (
                        <div className="bg-green-600 text-white p-3 flex justify-between items-center shadow-md animate-[slideDown_0.3s_ease-out]">
                            <div className="flex items-center">
                                <i className="ph-bold ph-download-simple text-2xl mr-3"></i>
                                <div>
                                    <p className="font-bold text-sm">Instalar Aplicativo</p>
                                    <p className="text-[10px] opacity-90">Acesso rápido e offline</p>
                                </div>
                            </div>
                            <button onClick={handleInstallClick} className="bg-white text-green-700 px-4 py-2 rounded-full font-bold text-xs shadow-sm active:scale-95 transition-transform">
                                INSTALAR
                            </button>
                        </div>
                    )}

                    {/* MODAL DE AÇÕES (BAIXAR / COMPARTILHAR) */}
                    {showActionModal && (
                        <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="text-lg font-bold text-gray-800">Documento Pronto!</h3>
                                    <button onClick={() => setShowActionModal(false)} className="bg-gray-100 p-2 rounded-full text-gray-500 hover:bg-gray-200">
                                        <i className="ph-bold ph-x text-lg"></i>
                                    </button>
                                </div>
                                <p className="text-sm text-gray-600 mb-6">O PDF foi gerado com sucesso. O que deseja fazer agora?</p>
                                
                                <div className="space-y-3">
                                    <button onClick={handleShare} className="w-full py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold flex items-center justify-center transition-colors shadow-sm">
                                        <i className="ph-bold ph-whatsapp-logo text-xl mr-2"></i>
                                        COMPARTILHAR
                                    </button>
                                    
                                    <button onClick={handleDownload} className="w-full py-4 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-xl font-bold flex items-center justify-center transition-colors shadow-sm">
                                        <i className="ph-bold ph-download-simple text-xl mr-2"></i>
                                        BAIXAR NO CELULAR
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Cabeçalho do Aplicativo */}
                    <div className="bg-blue-900 text-white rounded-b-3xl shadow-md px-6 pt-10 pb-10 mb-6 relative">
                        <div className="flex flex-col items-center justify-center mb-3">
                            <StarOfLife className="w-16 h-16 text-red-500 drop-shadow-md" />
                        </div>
                        <h1 className="text-center text-xl font-extrabold tracking-wide">Check-list de AMBULÂNCIA</h1>
                        <h2 className="text-center text-sm font-medium text-blue-200 mt-1 uppercase tracking-wider">EMERGÊNCIA 192, Macaé-RJ</h2>
                    </div>

                    <div className="max-w-2xl mx-auto px-4 sm:px-6">
                        
                        {/* Seção: Dados da Viatura */}
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6 relative overflow-hidden">
                            <h3 className="text-sm font-bold text-gray-800 uppercase flex items-center mb-4">
                                <i className="ph-fill ph-identification-card text-blue-600 text-xl mr-2"></i> Identificação
                            </h3>
                            
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                {/* ADICIONADO: Data movida para cima no form */}
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Data</label>
                                    <input type="date" name="data" value={headerData.data} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm" />
                                </div>
                                <div className="col-span-2 sm:col-span-2">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Condutor</label>
                                    <input type="text" name="condutor" value={headerData.condutor} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" placeholder="Nome completo" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Matrícula</label>
                                    <input type="text" name="matricula" value={headerData.matricula} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Base</label>
                                    <input type="text" name="base" value={headerData.base} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
                                </div>
                                
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">VTR Nº</label>
                                    <input type="text" name="vtr" value={headerData.vtr} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-blue-50 border border-blue-200 text-blue-800 font-bold rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Placa</label>
                                    <input type="text" name="placa" value={headerData.placa} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none uppercase" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Kilometragem</label>
                                    <input type="number" name="km" value={headerData.km} onChange={handleHeaderChange} 
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
                                </div>
                                
                                <div className="col-span-2 sm:col-span-1">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Modelo da VTR</label>
                                    <input type="text" name="modelo" value={headerData.modelo} onChange={handleHeaderChange} placeholder="Ex: Sprinter"
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
                                </div>
                                
                                {/* Nível de Combustível (Régua) */}
                                <div className="col-span-2 sm:col-span-3 mt-2 border-t border-gray-100 pt-4">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2 flex items-center">
                                        <i className="ph-fill ph-gas-pump text-blue-600 text-lg mr-2"></i> Nível de Combustível
                                    </label>
                                    <div className="flex bg-slate-100 p-1 rounded-xl shadow-inner w-full gap-1">
                                        {['Reserva', '1/4', '2/4', '3/4', 'Cheio'].map(nivel => (
                                            <button
                                                key={nivel}
                                                type="button"
                                                onClick={() => handleHeaderChange({name: 'combustivel', value: nivel})}
                                                className={`flex-1 py-3 rounded-lg font-bold text-[10px] sm:text-sm transition-all whitespace-nowrap
                                                    ${headerData.combustivel === nivel ? 'bg-blue-600 text-white shadow-md transform scale-[1.02]' : 'text-gray-500 hover:bg-slate-200'}`}
                                            >
                                                {nivel}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Seção: Itens Inspecionados */}
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold text-gray-800 uppercase flex items-center">
                                    <i className="ph-fill ph-check-square-offset text-blue-600 text-xl mr-2"></i> Itens Inspecionados
                                </h3>
                                <button onClick={handleMarkAllOk} className="text-[10px] sm:text-xs bg-green-100 text-green-700 px-3 py-2 rounded-lg font-bold hover:bg-green-200 active:scale-95 transition-all flex items-center shadow-sm">
                                    <i className="ph-bold ph-check-double mr-1 text-sm"></i> Marcar Todos OK
                                </button>
                            </div>
                            
                            <div className="space-y-4">
                                {items.map((item) => (
                                    <div key={item.id} className="border-b border-gray-100 pb-4 last:border-0 last:pb-0">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <span className="font-semibold text-gray-700 flex items-center">
                                                <span className="text-gray-400 text-xs w-6">{String(item.id).padStart(2, '0')}</span> 
                                                {item.nome}
                                            </span>
                                            <div className="flex bg-slate-100 p-1 rounded-xl shadow-inner">
                                                <button onClick={() => handleItemStatus(item.id, 'ok')}
                                                    className={`flex-1 sm:px-6 py-2 rounded-lg font-bold text-xs transition-all ${item.status === 'ok' ? 'bg-green-500 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                                    OK
                                                </button>
                                                <button onClick={() => handleItemStatus(item.id, 'avariado')}
                                                    className={`flex-1 sm:px-6 py-2 rounded-lg font-bold text-xs transition-all ${item.status === 'avariado' ? 'bg-red-500 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                                    AVARIA
                                                </button>
                                            </div>
                                        </div>
                                        {item.status === 'avariado' && (
                                            <div className="mt-3 relative animate-[fadeIn_0.2s_ease-out]">
                                                <i className="ph ph-warning-circle absolute left-3 top-3.5 text-red-400 text-lg"></i>
                                                <input type="text" placeholder="Descreva a avaria..." value={item.avariaText}
                                                    onChange={(e) => handleAvariaText(item.id, e.target.value)}
                                                    className="w-full p-3 pl-10 border border-red-200 rounded-xl bg-red-50 text-red-900 text-sm focus:ring-2 focus:ring-red-400 outline-none transition-all" />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Seção: Observações */}
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
                            <h3 className="text-sm font-bold text-gray-800 uppercase flex items-center mb-4">
                                <i className="ph-fill ph-notepad text-blue-600 text-xl mr-2"></i> Observações Gerais
                            </h3>
                            <textarea rows="3" value={observacoes} onChange={(e) => setObservacoes(e.target.value)}
                                className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none resize-none"
                                placeholder="Descreva outras alterações..."></textarea>
                        </div>

                        {/* Seção: Fotos */}
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
                            <h3 className="text-sm font-bold text-gray-800 uppercase flex items-center justify-between mb-4">
                                <span className="flex items-center"><i className="ph-fill ph-camera text-blue-600 text-xl mr-2"></i> Registro Fotográfico</span>
                                {photos.length > 0 && <span className="text-xs px-2 py-1 bg-slate-100 text-slate-500 rounded-lg font-bold">{photos.length} fotos</span>}
                            </h3>
                            
                            <div className="mb-4 transition-all">
                                <label className="flex flex-col items-center justify-center w-full p-6 border-2 border-dashed border-blue-300 rounded-2xl cursor-pointer bg-blue-50/50 hover:bg-blue-50 text-blue-600 transition-colors">
                                    <i className="ph-fill ph-image-square text-3xl mb-2"></i>
                                    <span className="font-semibold text-sm">Toque para anexar avarias</span>
                                    <span className="text-xs opacity-70 mt-1">Sem limite de fotos</span>
                                    <input type="file" accept="image/*" multiple onChange={handlePhotoUpload} className="hidden" />
                                </label>
                            </div>

                            {photos.length > 0 && (
                                <div className="grid grid-cols-3 gap-3">
                                    {photos.map((photo, index) => (
                                        <div key={index} className="relative rounded-xl overflow-hidden shadow-sm aspect-square bg-slate-100 border border-slate-200 group">
                                            <img src={photo} alt="Avaria" className="w-full h-full object-cover" />
                                            <button onClick={() => removePhoto(index)}
                                                className="absolute top-2 right-2 bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center shadow-md hover:bg-red-700 active:scale-95 transition-transform">
                                                <i className="ph-bold ph-x text-xs"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Botão Flutuante */}
                    <div className="fixed bottom-0 left-0 w-full p-4 bg-white/80 backdrop-blur-md border-t border-slate-200 z-50">
                        <div className="max-w-2xl mx-auto flex flex-col items-center">
                            <button onClick={generatePDF} disabled={isGenerating}
                                className={`w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center text-white transition-all shadow-blue-500/30 shadow-lg
                                    ${isGenerating ? 'bg-slate-400 scale-95' : 'bg-blue-600 hover:bg-blue-700 active:scale-95'}`}>
                                {isGenerating ? (
                                    <><i className="ph-bold ph-spinner-gap animate-spin text-2xl mr-2"></i> Processando...</>
                                ) : (
                                    <><i className="ph-bold ph-check-circle text-2xl mr-2"></i> GERAR DOCUMENTO</>
                                )}
                            </button>
                            <p className="mt-3 text-[11px] text-slate-500 font-semibold tracking-wide">
                                Aplicativo desenvolvido por <a href="https://instagram.com/rochasoulmusic" target="_blank" rel="noopener noreferrer" className="text-blue-600 font-bold hover:underline">@rochasoulmusic</a>
                            </p>
                        </div>
                    </div>

                    {/* MOLDE DO PDF OFICIAL */}
                    <div id="pdf-report-container" className="p-8 font-sans">
                        
                        <div className="text-center border-b-2 border-black pb-4 mb-4">
                            <h1 className="text-2xl font-bold uppercase tracking-wide m-0">Check-list de AMBULÂNCIA</h1>
                            <h2 className="text-base font-bold uppercase text-gray-700 m-0 mt-1">Emergência 192, Macaé-RJ</h2>
                        </div>

                        <table className="w-full border-collapse border border-black mb-4 text-sm">
                            <thead>
                                <tr>
                                    <th colSpan="2" className="border border-black bg-gray-200 p-1 text-center uppercase tracking-wider">Dados do Plantão</th>
                                    <th colSpan="4" className="border border-black bg-gray-200 p-1 text-center uppercase tracking-wider border-l-[3px]">Dados da Viatura</th>
                                </tr>
                            </thead>
                            <tbody>
                                {/* ADICIONADO: Data como primeiro campo no PDF na esquerda */}
                                <tr>
                                    <td className="border border-black p-1 bg-gray-100 font-bold w-[12%]">DATA:</td>
                                    <td className="border border-black p-1 w-[38%]">{formatDateBR(headerData.data)}</td>
                                    <td className="border border-black p-1 bg-gray-100 font-bold w-[15%] border-l-[3px]">VTR Nº:</td>
                                    <td className="border border-black p-1 font-bold text-center w-[10%] text-blue-900">{headerData.vtr}</td>
                                    <td className="border border-black p-1 bg-gray-100 font-bold w-[10%] text-center">PLACA:</td>
                                    <td className="border border-black p-1 uppercase text-center w-[15%]">{headerData.placa}</td>
                                </tr>
                                <tr>
                                    <td className="border border-black p-1 bg-gray-100 font-bold">CONDUTOR:</td>
                                    <td className="border border-black p-1 uppercase">{headerData.condutor}</td>
                                    <td className="border border-black p-1 bg-gray-100 font-bold border-l-[3px]">MODELO:</td>
                                    <td colSpan="3" className="border border-black p-1 uppercase text-center">{headerData.modelo}</td>
                                </tr>
                                <tr>
                                    <td className="border border-black p-1 bg-gray-100 font-bold">MATRÍCULA:</td>
                                    <td className="border border-black p-1">{headerData.matricula}</td>
                                    <td className="border border-black p-1 bg-gray-100 font-bold border-l-[3px] text-[11px]">KILOMETRAGEM:</td>
                                    <td colSpan="3" className="border border-black p-1 text-center">{headerData.km}</td>
                                </tr>
                                <tr>
                                    <td className="border border-black p-1 bg-gray-100 font-bold">BASE:</td>
                                    <td className="border border-black p-1 uppercase">{headerData.base}</td>
                                    <td className="border border-black p-1 bg-gray-100 font-bold border-l-[3px] text-[11px]">COMBUSTÍVEL:</td>
                                    <td colSpan="3" className="border border-black p-1 font-bold text-blue-800 uppercase text-center">{headerData.combustivel}</td>
                                </tr>
                            </tbody>
                        </table>

                        <div className="text-center font-bold bg-gray-200 border border-black p-1 mb-0 border-b-0 uppercase">Itens Inspecionados</div>
                        <div className="flex border border-black border-t-0 mb-4">
                            <table className="w-1/2 border-collapse border-r border-black text-sm">
                                <thead>
                                    <tr>
                                        <th className="border-b border-black p-1 bg-gray-100 text-left w-10">Nº</th>
                                        <th className="border-b border-r border-black p-1 bg-gray-100 text-left">ITEM</th>
                                        <th className="border-b border-black p-1 bg-gray-100 text-center w-20">STATUS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {coluna1.map(item => (
                                        <tr key={item.id}>
                                            <td className="border-b border-black p-1 text-center font-bold text-gray-500">{String(item.id).padStart(2, '0')}</td>
                                            <td className="border-b border-r border-black p-1">{item.nome}</td>
                                            <td className={`border-b border-black p-1 text-center font-bold uppercase
                                                ${item.status === 'ok' ? 'text-green-700' : item.status === 'avariado' ? 'text-red-700' : ''}`}>
                                                {item.status || '-'}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <table className="w-1/2 border-collapse text-sm">
                                <thead>
                                    <tr>
                                        <th className="border-b border-black p-1 bg-gray-100 text-left w-10">Nº</th>
                                        <th className="border-b border-r border-black p-1 bg-gray-100 text-left">ITEM</th>
                                        <th className="border-b border-black p-1 bg-gray-100 text-center w-20">STATUS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {coluna2.map(item => (
                                        <tr key={item.id}>
                                            <td className="border-b border-black p-1 text-center font-bold text-gray-500">{String(item.id).padStart(2, '0')}</td>
                                            <td className="border-b border-r border-black p-1">{item.nome}</td>
                                            <td className={`border-b border-black p-1 text-center font-bold uppercase
                                                ${item.status === 'ok' ? 'text-green-700' : item.status === 'avariado' ? 'text-red-700' : ''}`}>
                                                {item.status || '-'}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {avarias.length > 0 && (
                            <div className="mb-4 border border-black p-2 text-sm">
                                <div className="font-bold text-red-700 mb-1 border-b border-gray-300 pb-1 uppercase">Avarias Registradas:</div>
                                <ul className="list-disc pl-5 m-0 text-red-900">
                                    {avarias.map(a => (
                                        <li key={a.id}><strong>{a.nome}:</strong> {a.avariaText || 'Sem descrição'}</li>
                                    ))}
                                </ul>
                            </div>
                        )}

                        <div className="mb-4">
                            <div className="font-bold border border-black border-b-0 bg-gray-200 p-1 px-2 text-sm uppercase">Observações Gerais</div>
                            <div className="border border-black p-2 min-h-[60px] text-sm whitespace-pre-wrap">
                                {observacoes || "Sem alterações adicionais registradas."}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
